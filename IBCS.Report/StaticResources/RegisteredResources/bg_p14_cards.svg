<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F3F5F9"/><text x="62" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="600" fill="#566175" text-anchor="start" letter-spacing="0.3">Faizaan's IBCS Visuals</text><text x="62" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="start">faizaan.me</text><text x="1256" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="end">14 KPI cards and cross table</text><text x="1256" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="end">Page 14 of 14 · Finance data · USD</text><line x1="24" y1="50" x2="1256" y2="50" stroke="#E2E7EF"/><rect x="24" y="60" width="1232" height="158" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="58" width="1232" height="158" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Headline KPIs, USD K</text><text x="40" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">2026 YTD Sep · AC vs BU</text><text x="35" y="248" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">KPI cards</text><text x="35" y="269" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Six headline figures, each with its variance to budget in absolute and relative terms and a monthly sparkline.</text><text x="35" y="288" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Each card sums the months that have actuals and compares the same months of budget. Operating expenses are inverted: above budget reads red.</text><rect x="24" y="320" width="1232" height="280" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="318" width="1232" height="280" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="343" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue by business unit and product line × quarter, USD K</text><text x="40" y="360" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Q1–Q3 2026 · AC, ΔBU</text><text x="35" y="630" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Cross table with integrated variances</text><text x="35" y="651" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Business units and product lines down, quarters across: each quarter shows actual and a ΔBU bar, year to date at the right.</text><text x="35" y="670" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Rows and columns are both dimensions here, unlike T01–T04 where the columns are scenarios. Product lines are collapsed; open a unit to see them.</text></svg>