<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F3F5F9"/><text x="62" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="600" fill="#566175" text-anchor="start" letter-spacing="0.3">Faizaan's IBCS Visuals</text><text x="62" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="start">faizaan.me</text><text x="1256" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="end">04 Scatter and bubble</text><text x="1256" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="end">Page 4 of 14 · Finance data · USD</text><line x1="24" y1="50" x2="1256" y2="50" stroke="#E2E7EF"/><rect x="24" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue vs gross margin, product line × region</text><text x="40" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">2026 YTD Sep · AC</text><text x="35" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="700" fill="#1A2233" text-anchor="start">C7</text><text x="69.8" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Scattergrams</text><text x="35" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">36 points, one per product line and region: net revenue across, gross margin up, coloured by</text><text x="35" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">business unit.</text><text x="35" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">The dashed curves join points of equal gross profit (revenue × margin), so the third figure reads</text><text x="35" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">straight off the chart.</text><rect x="646" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="646" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="662" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Product lines: growth, margin and size</text><text x="662" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">2026 YTD Sep · AC, growth vs PY</text><text x="657" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="700" fill="#1A2233" text-anchor="start">C8</text><text x="691.8" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Bubble charts</text><text x="657" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Each product line placed by revenue growth against prior year and by gross margin, sized by</text><text x="657" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">net revenue.</text><text x="657" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">For positions set by two unrelated attributes and a size set by a third: which lines grow</text><text x="657" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">profitably, and how much they weigh.</text></svg>