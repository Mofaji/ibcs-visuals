y, with the variance columns drawn as ΔBU bars and ΔBU% pins inside the table.</text><text x="35" y="650" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">One scale per column across all rows, so bar lengths compare honestly between a whole business unit and a single product line.</text></svg>