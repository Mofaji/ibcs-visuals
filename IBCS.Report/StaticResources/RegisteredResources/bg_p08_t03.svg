 EBITDA, EBIT …) with margin rows, every variance as a figure.</text><text x="35" y="650" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Result rows are computed in the visual from the items above them, so they always add up. EBITDA is collapsed; open it to see the cost lines.</text></svg>