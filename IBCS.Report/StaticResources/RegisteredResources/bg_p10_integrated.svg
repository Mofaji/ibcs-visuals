<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F3F5F9"/><text x="62" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="600" fill="#566175" text-anchor="start" letter-spacing="0.3">Faizaan's IBCS Visuals</text><text x="62" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="start">faizaan.me</text><text x="1256" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="end">10 Integrated and hills</text><text x="1256" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="end">Page 10 of 14 · Finance data · USD</text><line x1="24" y1="50" x2="1256" y2="50" stroke="#E2E7EF"/><rect x="24" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue, USD K</text><text x="40" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Jan–Dec 2026 · AC, BU</text><text x="35" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Integrated variance columns</text><text x="35" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">One column per month: dark up to the smaller of actual and budget, the gap green where</text><text x="35" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">actual is ahead and red where it falls short.</text><text x="35" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">The black tick marks the budget. The variance sits inside the column instead of in its own tier,</text><text x="35" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">which suits small cards.</text><rect x="646" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="646" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="662" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">EBITDA, USD K</text><text x="662" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Jan–Sep 2026 · AC, BU</text><text x="657" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Hills &amp; valleys</text><text x="657" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Actual and budget as two lines, the area between them filled green where actual leads and</text><text x="657" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">red where it trails.</text><text x="657" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Shows the size and timing of the gap at a glance; useful for longer monthly series where columns</text><text x="657" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">get crowded.</text></svg>