<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F3F5F9"/><text x="62" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="600" fill="#566175" text-anchor="start" letter-spacing="0.3">Faizaan's IBCS Visuals</text><text x="62" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="start">faizaan.me</text><text x="1256" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="end">13 Stacked charts</text><text x="1256" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="end">Page 13 of 14 · Finance data · USD</text><line x1="24" y1="50" x2="1256" y2="50" stroke="#E2E7EF"/><rect x="24" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue by business unit, USD K</text><text x="40" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Jan–Sep 2026 · AC monthly</text><text x="35" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="700" fill="#1A2233" text-anchor="start">C01</text><text x="78.2" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Stacked column charts</text><text x="35" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Development over time with its structure: one column per month, business units as stacked</text><text x="35" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">segments, totals on top.</text><text x="35" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Best for up to 5–6 series and 25 periods. Only the lowest segment and the total compare exactly,</text><text x="35" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">so series names sit beside the last column instead of a legend.</text><rect x="646" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="646" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="662" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue by region and business unit, USD K</text><text x="662" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">2026 YTD Sep · AC</text><text x="657" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="700" fill="#1A2233" text-anchor="start">C02</text><text x="700.2" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Stacked bar charts</text><text x="657" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Structure at one point in time: one bar per region, stacked by business unit and sorted by</text><text x="657" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">total.</text><text x="657" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Structure runs down the vertical axis, never time. Totals sit at the bar ends; keep to 5–6 series</text><text x="657" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">and 25 elements.</text></svg>