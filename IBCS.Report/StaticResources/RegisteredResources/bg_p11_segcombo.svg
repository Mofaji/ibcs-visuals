<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F3F5F9"/><text x="62" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="600" fill="#566175" text-anchor="start" letter-spacing="0.3">Faizaan's IBCS Visuals</text><text x="62" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="start">faizaan.me</text><text x="1256" y="25" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="end">11 Forecast and combo</text><text x="1256" y="39" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A5" text-anchor="end">Page 11 of 14 · Finance data · USD</text><line x1="24" y1="50" x2="1256" y2="50" stroke="#E2E7EF"/><rect x="24" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="24" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="40" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue, USD K</text><text x="40" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Jan–Dec 2026 · AC, FC</text><text x="35" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Segmented actual and forecast</text><text x="35" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">One series through the year: actuals solid to September, the forecast hatched from October</text><text x="35" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">to December.</text><text x="35" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">IBCS scenario notation does the work: solid is actual, hatched is forecast, outlined would be</text><text x="35" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">plan.</text><rect x="646" y="60" width="610" height="520" rx="10" fill="#D9E0EA" fill-opacity="0.45"/><rect x="646" y="58" width="610" height="520" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/><text x="662" y="83" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="13" font-weight="600" fill="#1A2233" text-anchor="start">Net revenue and gross margin</text><text x="662" y="100" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11" font-weight="400" fill="#8A93A5" text-anchor="start">Jan–Dec 2026 · AC, BU; gross margin AC</text><text x="657" y="610" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="14.5" font-weight="600" fill="#1A2233" text-anchor="start">Combo chart</text><text x="657" y="631" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">Net revenue against budget with its variance tier, plus gross margin % as a line on its own</text><text x="657" y="648" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="12.5" font-weight="400" fill="#566175" text-anchor="start">scale above the columns.</text><text x="657" y="667" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">Two measures, two scales, never one shared axis: the margin line has its own band, so it cannot</text><text x="657" y="682" font-family="Segoe UI, wf_standard-font, sans-serif" font-size="11.5" font-weight="400" fill="#8A93A5" text-anchor="start">be misread against the columns.</text></svg>